<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver - 01 INFORMATICA</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2f; color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app-container { background-color: #2a2a40; width: 400px; height: 600px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; }
        
        /* PANTALLA DE LOGIN */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; text-align: center; }
        #login-screen h1 { color: #00d2ff; }
        input[type="text"] { width: 80%; padding: 10px; margin: 20px 0; border: none; border-radius: 5px; outline: none; font-size: 16px; }
        button { background-color: #00d2ff; color: #1e1e2f; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #0099cc; }
        #login-error { color: #ff4c4c; margin-top: 10px; font-size: 14px; }

        /* PANTALLA DE CHAT */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #chat-header { background-color: #1e1e2f; padding: 15px; text-align: center; border-bottom: 2px solid #00d2ff; }
        #chat-header h2 { margin: 0; font-size: 18px; color: #00d2ff; }
        
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 14px; }
        .user-msg { background-color: #00d2ff; color: #1e1e2f; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background-color: #3b3b5c; align-self: flex-start; border-bottom-left-radius: 2px; }
        .bot-origin { font-size: 10px; color: #aaa; margin-bottom: 5px; display: block; border-bottom: 1px solid #555; padding-bottom: 3px; }
        
        #input-area { padding: 15px; background-color: #1e1e2f; display: flex; gap: 10px; }
        #chat-input { flex: 1; padding: 10px; border-radius: 20px; border: none; outline: none; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- PANTALLA DE ACCESO -->
    <div id="login-screen">
        <h1>01 INFORMATICA</h1>
        <p>Introduce tu número de teléfono para acceder a soporte técnico.</p>
        <input type="text" id="phone-input" placeholder="Ej: 600000000">
        <button onclick="verificarCliente()">Acceder</button>
        <p id="login-error"></p>
    </div>

    <!-- PANTALLA DE CHAT -->
    <div id="chat-screen">
        <div id="chat-header">
            <h2 id="welcome-text">Asistente Oliver</h2>
        </div>
        <div id="chat-box">
            <!-- Los mensajes aparecerán aquí -->
        </div>
        <div id="input-area">
            <input type="text" id="chat-input" placeholder="Escribe tu consulta técnica..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>
</div>

<script>
    const baseUrl = "http://127.0.0.1:8000";

    // 1. VERIFICACIÓN DEL CLIENTE
    async function verificarCliente() {
        const telefono = document.getElementById("phone-input").value;
        const errorMsg = document.getElementById("login-error");
        
        if (!telefono) { errorMsg.innerText = "Por favor, introduce un teléfono."; return; }
        errorMsg.innerText = "Verificando...";

        try {
            const respuesta = await fetch(`${baseUrl}/verificar_cliente/${telefono}`);
            const datos = await respuesta.json();

            if (datos.estado === "registrado") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("chat-screen").style.display = "flex";
                document.getElementById("welcome-text").innerText = `Oliver - ${datos.privilegio.toUpperCase()}`;
                añadirMensajeBot("Sistema", datos.mensaje + " ¿En qué puedo ayudarte hoy?");
            } else {
                errorMsg.innerText = datos.mensaje;
            }
        } catch (error) {
            errorMsg.innerText = "Error al conectar con el servidor.";
        }
    }

    // 2. ENVIAR MENSAJE A OLIVER Y RECIBIR RESPUESTA RAG/CACHÉ
    async function enviarMensaje() {
        const input = document.getElementById("chat-input");
        const pregunta = input.value.trim();
        if (!pregunta) return;

        // Mostrar el mensaje del usuario en la pantalla
        añadirMensajeUsuario(pregunta);
        input.value = "";
        
        // Poner a Oliver a "pensar"
        const idPensando = añadirMensajeBot("Sistema", "Oliver está escribiendo...");

        try {
            const respuesta = await fetch(`${baseUrl}/soporte_tecnico/?pregunta=${encodeURIComponent(pregunta)}`);
            const datos = await respuesta.json();
            
            // Reemplazar el mensaje de "pensando" por la respuesta real
            actualizarMensajeBot(idPensando, datos.origen, datos.respuesta);
        } catch (error) {
            actualizarMensajeBot(idPensando, "Error", "No se pudo conectar con el cerebro de Oliver.");
        }
    }

    // Funciones visuales (burbujas de chat)
    function añadirMensajeUsuario(texto) {
        const chatBox = document.getElementById("chat-box");
        chatBox.innerHTML += `<div class="message user-msg">${texto}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function añadirMensajeBot(origen, texto) {
        const chatBox = document.getElementById("chat-box");
        const id = "msg-" + Date.now();
        chatBox.innerHTML += `
            <div class="message bot-msg" id="${id}">
                <span class="bot-origin">${origen}</span>
                ${texto}
            </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }

    function actualizarMensajeBot(id, origen, texto) {
        const msgDiv = document.getElementById(id);
        msgDiv.innerHTML = `
            <span class="bot-origin">${origen}</span>
            ${texto}
        `;
    }
</script>

</body>
</html>
